<div class="filltank-container">
  <h1>Fill Tank</h1>

  <div class="filltank-grid">

    <!-- Form -->
    <form (ngSubmit)="handleSubmit()">

      <label>Fuel Type</label>
      <div class="fuel-type-selector">
        <button
          type="button"
          class="fuel-btn"
          [class.active]="fuelType === 'petrol'"
          (click)="setFuelType('petrol')"
        >
          ⛽ Petrol
        </button>
        <button
          type="button"
          class="fuel-btn"
          [class.active]="fuelType === 'diesel'"
          (click)="setFuelType('diesel')"
        >
          🛢️ Diesel
        </button>
      </div>

      <label>Liters to Add</label>
      <input
        type="number"
        min="1"
        [(ngModel)]="liters"
        name="liters"
        placeholder="Enter liters"
        (input)="error = ''"
      />

      <p *ngIf="error" class="error-msg">{{ error }}</p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Adding...' : 'Add ' + fuelType + ' fuel' }}
      </button>

    </form>

    <!-- Tank Level -->
    <div class="tank-card">
      <div class="tank-card-title">
        {{ fuelType === 'petrol' ? 'Petrol' : 'Diesel' }} Tank Level
      </div>
      <div class="tank-card-subtitle">Current tank capacity</div>

      <div *ngIf="tankLoading" class="tank-loading">Loading...</div>
      <div *ngIf="tankError && !tankLoading" class="tank-err">{{ tankError }}</div>

      <ng-container *ngIf="!tankLoading && !tankError">
        <div class="tank-wrap">
          <svg width="140" height="220" viewBox="0 0 140 220">
            <rect x="20" y="10" width="100" height="180" rx="18"
                  fill="#1e293b" stroke="#334155" stroke-width="2"/>
            <clipPath id="refillTankClip">
              <rect x="22" y="12" width="96" height="176" rx="16"/>
            </clipPath>
            <g clip-path="url(#refillTankClip)">
              <rect x="22" [attr.y]="svgRectY" width="96" [attr.height]="svgRectH"
                    [attr.fill]="fuelColor" opacity="0.85"
                    style="transition: all 1.2s cubic-bezier(0.34,1.56,0.64,1)"/>
              <path [attr.d]="svgPathD" [attr.fill]="fuelColor" opacity="0.6"
                    style="transition: all 1.2s cubic-bezier(0.34,1.56,0.64,1)"/>
            </g>
            <g *ngFor="let lvl of svgMarkers">
              <line x1="20" [attr.y1]="markerY(lvl)" x2="34" [attr.y2]="markerY(lvl)"
                    stroke="#475569" stroke-width="1.5"/>
              <text x="36" [attr.y]="markerY(lvl) + 4"
                    fill="#64748b" font-size="9" font-family="monospace">
                {{ lvl }}%
              </text>
            </g>
            <rect x="55" y="2"    width="30" height="10" rx="4" fill="#334155"/>
            <rect x="120" y="130" width="14" height="8"  rx="3" fill="#334155"/>
          </svg>

          <div class="tank-readout">
            <div class="tank-percent" [style.color]="fuelColor">
              {{ tankFillPercent | number:'1.0-0' }}%
            </div>
            <div class="tank-cap-label">
              {{ formatNumber(tank.current_level) }}L / {{ formatNumber(tank.capacity) }}L
            </div>
          </div>
        </div>

        <div class="tank-status" [ngClass]="tankStatusClass">{{ tankStatusText }}</div>
      </ng-container>
    </div>

  </div>

  <div *ngIf="success" class="rt-success-toast">
    <i class="fa fa-check-circle"></i>
    <span>{{ success }}</span>
  </div>

</div>
