<div class="cp-container">
  <div class="cp-header">
    <div class="cp-header-icon"><i class="fa fa-lock"></i></div>
    <div>
      <h2 class="cp-title">Reset User Password</h2>
      <p class="cp-subtitle">Reset any user's password without requiring their current one.</p>
    </div>
  </div>

  <!-- Alerts -->
  <div class="cp-alert cp-alert--success" *ngIf="success">
    <i class="fa fa-check-circle"></i> {{ success }}
  </div>
  <div class="cp-alert cp-alert--error" *ngIf="error">
    <i class="fa fa-exclamation-circle"></i> {{ error }}
  </div>

  <div class="cp-section">
    <form class="cp-form" (ngSubmit)="submitAdmin()" #af="ngForm">

      <div class="cp-field">
        <label class="cp-label" for="userSearch">Search User</label>
        <div class="cp-search-wrap">
          <i class="fa fa-search cp-search-icon"></i>
          <input id="userSearch" name="userSearch" type="text"
                 class="cp-input cp-input--search" placeholder="Search by name or email…"
                 [(ngModel)]="userSearch" autocomplete="off" />
          <button *ngIf="userSearch" type="button" class="cp-search-clear" (click)="userSearch = ''">
            <i class="fa fa-times"></i>
          </button>
        </div>
      </div>

      <div class="cp-field">
        <label class="cp-label" for="userSelect">Select User</label>
        <select id="userSelect" name="selectedUserId" class="cp-select"
                [(ngModel)]="selectedUserId" required>
          <option [ngValue]="null" disabled>— choose a user —</option>
          <option *ngFor="let u of filteredUsers" [ngValue]="u.userId ?? u.id">
            {{ u.username }} — {{ u.email }} ({{ u.role }})
          </option>
        </select>
        <p class="cp-hint" *ngIf="filteredUsers.length === 0">No users match your search.</p>
      </div>

      <div class="cp-field">
        <label class="cp-label" for="adminNew">New Password</label>
        <input id="adminNew" name="adminNewPassword" type="password"
               class="cp-input" placeholder="Enter new password…"
               [(ngModel)]="adminForm.newPassword" required autocomplete="new-password" />
      </div>

      <div class="cp-field">
        <label class="cp-label" for="adminConfirm">Confirm Password</label>
        <input id="adminConfirm" name="adminConfirmPassword" type="password"
               class="cp-input" placeholder="Confirm new password…"
               [(ngModel)]="adminForm.confirmPassword" required autocomplete="new-password" />
      </div>

      <div class="cp-actions">
        <button type="submit" class="cp-btn cp-btn--danger" [disabled]="saving || af.invalid">
          <i class="fa fa-spinner fa-spin" *ngIf="saving"></i>
          <span>{{ saving ? 'Resetting…' : 'Reset Password' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
