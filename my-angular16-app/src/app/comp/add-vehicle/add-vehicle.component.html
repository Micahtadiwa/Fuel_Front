<div class="add-vehicle-container">

  <h2>Add New Vehicle</h2>

  <form class="vehicle-form" (ngSubmit)="handleSubmit()">

    <div class="form-group">
      <label>Vehicle Number Plate</label>
      <input
        type="text"
        name="NumberPlate"
        [(ngModel)]="vehicle.NumberPlate"
        placeholder="Enter vehicle number plate"
        required
      />
    </div>

    <div class="form-group">
      <label>Vehicle Make</label>
      <input
        type="text"
        name="make"
        [(ngModel)]="vehicle.make"
        placeholder="Enter vehicle make"
        required
      />
    </div>

    <div class="form-group">
      <label>Vehicle Model</label>
      <input
        type="text"
        name="model"
        [(ngModel)]="vehicle.model"
        placeholder="Enter vehicle model"
        required
      />
    </div>

    <div class="form-group">
      <label>Chassis Number</label>
      <input
        type="text"
        name="ChassisNumber"
        [(ngModel)]="vehicle.ChassisNumber"
        placeholder="Enter chassis number"
        required
      />
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading">
      {{ loading ? 'Adding...' : 'Add Vehicle' }}
    </button>

  </form>

  <p *ngIf="success" style="color:green; margin-top:1rem;">{{ success }}</p>
  <p *ngIf="error"   style="color:red;   margin-top:1rem;">{{ error }}</p>

</div>
