<div class="vehicles-container">

  <h1 class="vehicles-title">Vehicles</h1>

  <div class="vehicles-table-wrapper">
    <table class="vehicles-table">
      
      <thead>
        <tr>
          <th (click)="handleSort('NumberPlate')">Number Plate</th>
          <th (click)="handleSort('make')">Make</th>
          <th (click)="handleSort('model')">Model</th>
          <th>Chassis Number</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let vehicle of pagedVehicles">
          <td>{{ vehicle.NumberPlate }}</td>
          <td>{{ vehicle.make }}</td>
          <td>{{ vehicle.model }}</td>
          <td>{{ vehicle.ChassisNumber }}</td>
          <td>
            <button class="btns edit-btn">Edit</button>
            <button class="btns delete-btn" (click)="deleteVehicle(vehicle.id)">Delete</button>
          </td>
        </tr>
      </tbody>

    </table>
    <div class="pg-bar" *ngIf="totalPages > 1">
      <button class="pg-btn" (click)="prevPage()" [disabled]="page === 1">&#8592; Prev</button>
      <span class="pg-info">Page {{ page }} of {{ totalPages }}</span>
      <button class="pg-btn" (click)="nextPage()" [disabled]="page === totalPages">Next &#8594;</button>
    </div>
  </div>

</div>
