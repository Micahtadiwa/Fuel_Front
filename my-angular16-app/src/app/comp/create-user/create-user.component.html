<div class="er-container">
  <div class="er-header">
    <div class="er-header-icon"><i class="fa fa-user-plus"></i></div>
    <div>
      <h2 class="er-title">Create User</h2>
      <p class="er-subtitle">Add a new user and assign their role immediately.</p>
    </div>
  </div>

  <!-- SUCCESS -->
  <div class="er-alert er-alert--success" *ngIf="success">
    <i class="fa fa-check-circle"></i> {{ success }}
  </div>

  <!-- ERROR -->
  <div class="er-alert er-alert--error" *ngIf="error">
    <i class="fa fa-exclamation-circle"></i> {{ error }}
  </div>

  <form class="er-form" (ngSubmit)="handleSubmit()" #f="ngForm">

    <div class="er-field">
      <label class="er-label" for="name">Username</label>
      <input
        id="name"
        name="name"
        type="text"
        class="er-search-input"
        placeholder="Enter username…"
        [(ngModel)]="formData.name"
        required
        autocomplete="off"
      />
    </div>

    <div class="er-field">
      <label class="er-label" for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        class="er-search-input"
        placeholder="Enter email address…"
        [(ngModel)]="formData.email"
        required
        autocomplete="off"
      />
    </div>

    <div class="er-field">
      <label class="er-label" for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        class="er-search-input"
        placeholder="Enter password…"
        [(ngModel)]="formData.password"
        required
        autocomplete="new-password"
      />
    </div>

    <!-- Role selector -->
    <div class="er-field">
      <label class="er-label">Select Role</label>
      <div class="er-role-grid">
        <button
          *ngFor="let role of availableRoles"
          type="button"
          class="er-role-pill"
          [class.er-role-pill--active]="formData.role === role"
          (click)="setRole(role)"
        >
          <i class="fa" [ngClass]="roleIcon(role)"></i>
          {{ role | titlecase }}
        </button>
      </div>
      <input type="hidden" name="role" [(ngModel)]="formData.role" required />
    </div>

    <!-- Actions -->
    <div class="er-actions">
      <button type="button" class="er-btn er-btn--secondary" routerLink="/users">
        Cancel
      </button>
      <button
        type="submit"
        class="er-btn er-btn--primary"
        [disabled]="saving || f.invalid"
      >
        <i class="fa fa-spinner fa-spin" *ngIf="saving"></i>
        <span>{{ saving ? 'Creating…' : 'Create User' }}</span>
      </button>
    </div>

  </form>
</div>
