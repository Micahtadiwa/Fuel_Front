<!-- MOBILE TOGGLE BUTTON -->
<button class="mobile-toggle" (click)="toggleMobileSidebar()">
  <i class="fa fa-bars"></i>
</button>

<!-- OVERLAY -->
<div class="sidebar-overlay"
     *ngIf="isMobileOpen"
     (click)="closeMobileSidebar()">
</div>

<!-- SIDEBAR -->
<div class="sidebar"
     [class.collapsed]="isCollapsed"
     [class.mobile-open]="isMobileOpen">

  <!-- BRAND -->
  <div class="sidebar-brand">
    <div class="logo">
      <i class="fa fa-gas-pump"></i>
      <div class="logo-text">Fuel App</div>
    </div>
    <button class="btn-close" (click)="toggleSidebar()">
      <i class="fa fa-times"></i>
    </button>
  </div>

  <!-- NAV -->
  <nav class="sidebar-nav">
    <ul>
      <li *ngFor="let item of visibleItems" class="side-nav-item">
        <a class="side-nav-link"
           [routerLink]="item.routeLink"
           routerLinkActive="active"
           (click)="closeMobileSidebar()">
          <i [class]="item.icon"></i>
          <span class="sidenav-link-text">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- USER PROFILE + LOGOUT -->
  <div class="sidebar-footer">
    <div class="user-profile">
      <div class="user-avatar">{{ userInitials }}</div>
      <div class="user-info">
        <span class="user-name">{{ username }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>
    </div>
    <button class="btn-logout" (click)="logout()" title="Logout">
      <i class="fa fa-sign-out"></i>
      <span class="sidenav-link-text">Logout</span>
    </button>
  </div>

</div>
