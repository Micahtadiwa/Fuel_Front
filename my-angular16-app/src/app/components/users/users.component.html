<div class="user-dashboard">

  <!-- HEADER -->
  <div class="title-section">
    <h1 class="dashboard-title">User Management</h1>
    <p class="dashboard-subtitle">Manage system users, roles and permissions.</p>
  </div>

  <!-- LOADING -->
  <div class="state-box" *ngIf="loading">
    <i class="fa fa-spinner fa-spin state-icon"></i>
    <span>Loading users…</span>
  </div>

  <!-- ERROR -->
  <div class="state-box state-box--error" *ngIf="error && !loading">
    <i class="fa fa-exclamation-circle state-icon"></i>
    <span>{{ error }}</span>
  </div>

  <ng-container *ngIf="!loading && !error">

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card" *ngFor="let card of statCards" [ngClass]="card.cls">
        <i class="stat-icon" [ngClass]="card.icon"></i>
        <div class="stat-number">{{ card.value }}</div>
        <span class="stat-label">{{ card.label }}</span>
      </div>
    </div>

    <!-- QUICK ACTIONS -->
    <div class="bottom-section">
      <h2 class="section-title">Quick Actions</h2>
      <div class="buttons-grid">
        <a *ngFor="let action of visibleQuickActions"
           [routerLink]="action.route"
           class="action-card"
           [ngClass]="action.cls">
          <i class="action-icon-fa" [ngClass]="action.icon"></i>
          <span class="action-title">{{ action.title }}</span>
          <span class="action-desc">{{ action.desc }}</span>
        </a>
      </div>
    </div>

  </ng-container>

</div>
